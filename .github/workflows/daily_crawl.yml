name: Daily Music News Crawl

on:
  schedule:
    - cron: '0 6 * * *'      # 6:00 AM UTC — crawl + AI pipeline
  workflow_dispatch:           # manual trigger for testing
    inputs:
      lang:
        description: 'Language filter (en/ro/fr/de/it/es — leave blank for all)'
        required: false
      dry_run:
        description: 'Dry run? (true/false)'
        required: false
        default: 'false'

jobs:
  crawl:
    name: Crawl & Process Articles
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          LIBRETRANSLATE_URL:    ${{ secrets.LIBRETRANSLATE_URL }}
          LIBRETRANSLATE_KEY:    ${{ secrets.LIBRETRANSLATE_KEY }}
          RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:     ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME:      ${{ secrets.RESEND_FROM_NAME }}
          APP_BASE_URL:          ${{ secrets.APP_BASE_URL }}
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
          LOG_LEVEL:             INFO
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.lang }}" ]; then
            ARGS="$ARGS --lang ${{ github.event.inputs.lang }}"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python crawler/main.py $ARGS

      - name: Send newsletters
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:     ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME:      ${{ secrets.RESEND_FROM_NAME }}
          APP_BASE_URL:          ${{ secrets.APP_BASE_URL }}
          LOG_LEVEL:             INFO
        run: python newsletter/sender.py

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:          ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM_EMAIL:    ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          python - <<'EOF'
          import os, resend, json
          resend.api_key = os.environ["RESEND_API_KEY"]
          resend.Emails.send({
            "from": f"Music Digest CI <{os.environ['RESEND_FROM_EMAIL']}>",
            "to":   [os.environ["ALERT_EMAIL"]],
            "subject": "⚠️ Music Digest: daily crawl FAILED",
            "html": "<p>The daily crawl GitHub Action failed. Check the <a href='https://github.com/YOUR_ORG/music-news-crawler/actions'>Actions log</a> for details.</p>",
          })
          print("Alert sent.")
          EOF

  # ── Weekly source health check (Sundays) ──────────────────────
  validate_sources:
    name: Weekly RSS Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Validate all sources
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Only runs on Sundays (day-of-week 0 = Sunday)
        run: |
          if [ "$(date +%u)" = "7" ]; then
            python scripts/validate_rss.py --update-db
          else
            echo "Not Sunday — skipping source validation"
          fi
